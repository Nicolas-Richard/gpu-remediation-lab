apiVersion: v1
kind: Namespace
metadata:
  name: gpu-remediation-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-canary
  namespace: gpu-remediation-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remediation-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediation-canary
        jobset.sigs.k8s.io/jobset-name: aws-dcgm-injection
        gpu-orch.dev/auto-remediate: "true"
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        gpu-orch.dev/node-pool: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: canary
          image: public.ecr.aws/docker/library/alpine:3.22
          command: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
